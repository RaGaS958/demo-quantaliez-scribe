[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantaliez-voice-scribe"
version = "0.1.0"
description = "Demo: ambient AI voice scribe that turns an OPD consultation into an ABDM FHIR R4 OP Consult Record, approved by the doctor"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# LiveKit ambient capture, transformed from the original Lauki voice agent
livekit = ["livekit-agents>=1.0"]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["scribe", "voice_agent"]
